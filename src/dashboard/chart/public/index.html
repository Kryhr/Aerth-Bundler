<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AERTH BUNDLER - Live Chart</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --green: #26a69a;
    --red: #ef5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header .badge {
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    margin-left: 10px;
  }
  .stats {
    display: flex;
    gap: 24px;
  }
  .stat {
    text-align: right;
  }
  .stat .label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
  }
  .stat .value {
    font-size: 18px;
    font-weight: 600;
  }
  #price-value.up { color: var(--green); }
  #price-value.down { color: var(--red); }
  #chart-container {
    width: 100%;
    height: calc(100vh - 60px);
  }
  #status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 6px;
  }
  #status-dot.live { background: var(--green); }
</style>
</head>
<body>
  <header>
    <div>
      <h1><span id="status-dot"></span>AERTH BUNDLER <span class="badge" id="token-badge">no token</span></h1>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="label">Price</div>
        <div class="value" id="price-value">--</div>
      </div>
      <div class="stat">
        <div class="label">24h Volume</div>
        <div class="value" id="volume-value">--</div>
      </div>
    </div>
  </header>
  <div id="chart-container"></div>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="chart.js"></script>
</body>
</html>
