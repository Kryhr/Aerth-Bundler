<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERTH BUNDLER - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e17;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .header-left h1 { font-size: 20px; font-weight: 600; color: #fff; }
    .token-info { font-size: 13px; color: #888; }
    .token-info .mint { font-family: monospace; background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 4px; color: #aaa; }

    .status-badge {
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-badge.idle { background: rgba(100,100,100,0.2); color: #888; }
    .status-badge.preparing { background: rgba(100,150,255,0.2); color: #6496ff; }
    .status-badge.launching { background: rgba(0,200,255,0.15); color: #00c8ff; }
    .status-badge.buying { background: rgba(0,255,100,0.15); color: #00ff64; }
    .status-badge.simulating { background: rgba(255,200,0,0.15); color: #ffc800; }
    .status-badge.exiting { background: rgba(255,0,0,0.2); color: #ff4444; animation: pulse 1s infinite; }
    .status-badge.complete { background: rgba(0,255,100,0.2); color: #00ff64; }
    .status-badge.error { background: rgba(255,0,0,0.2); color: #ff4444; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-box {
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .stat-box .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-box .value { font-size: 18px; font-weight: 600; color: #fff; margin-top: 4px; }
    .stat-box .value.green { color: #00ff64; }
    .stat-box .value.red { color: #ff4444; }
    .stat-box .value.yellow { color: #ffc800; }

    /* Chart */
    .chart-wrapper {
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 16px;
      margin-bottom: 16px;
    }
    #chart-container { width: 100%; height: 400px; }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .controls button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .controls button:hover { transform: translateY(-1px); }
    .btn-exit { background: #ff4444; color: #fff; }
    .btn-exit:hover { background: #ff6666; }
    .btn-stop { background: #ff8c00; color: #fff; }
    .btn-stop:hover { background: #ffaa44; }
    .btn-refresh { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-refresh:hover { background: rgba(255,255,255,0.2); }

    /* Log */
    .log {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.04);
      font-family: monospace;
      font-size: 12px;
      color: #555;
      max-height: 80px;
      overflow: auto;
    }
    .log .info { color: #4fc3f7; }
    .log .success { color: #00ff64; }
    .log .warning { color: #ffc800; }
    .log .error { color: #ff4444; }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .header-left { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>🚀 AERTH</h1>
      <div class="token-info">
        <span id="tokenSymbol">---</span>
        <span class="mint" id="tokenMint">Waiting...</span>
      </div>
    </div>
    <div>
      <span class="status-badge idle" id="statusBadge">● IDLE</span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-box"><div class="label">Price</div><div class="value" id="price">$0.000000</div></div>
    <div class="stat-box"><div class="label">Multiplier</div><div class="value" id="multiplier">1.00x</div></div>
    <div class="stat-box"><div class="label">Target</div><div class="value" id="target">3.00x</div></div>
    <div class="stat-box"><div class="label">Volume</div><div class="value" id="volume">0.00 SOL</div></div>
    <div class="stat-box"><div class="label">Time Left</div><div class="value" id="timeLeft">--:--:--</div></div>
    <div class="stat-box"><div class="label">Phase</div><div class="value" id="phase">Idle</div></div>
  </div>

  <!-- Chart -->
  <div class="chart-wrapper">
    <div id="chart-container"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-exit" onclick="triggerExit()">🔥 Exit Now</button>
    <button class="btn-stop" onclick="triggerStop()">⏹ Stop Bundler</button>
    <button class="btn-refresh" onclick="refresh()">🔄 Refresh</button>
  </div>

  <!-- Log -->
  <div class="log" id="log">⏳ Connecting to server...</div>
</div>

<!-- Vendor -->
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

<script>
  // ============================================================
  // STATE
  // ============================================================
  
  let chart = null;
  let candleSeries = null;
  let volumeSeries = null;
  let priceHistory = [];

  // ============================================================
  // INIT CHART
  // ============================================================

  function initChart() {
    const container = document.getElementById('chart-container');
    
    chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: 400,
      layout: { backgroundColor: 'transparent', textColor: '#888', fontSize: 12 },
      grid: { vertLines: { color: 'rgba(255,255,255,0.05)' }, horzLines: { color: 'rgba(255,255,255,0.05)' } },
      priceScale: { borderColor: 'rgba(255,255,255,0.1)' },
      timeScale: { borderColor: 'rgba(255,255,255,0.1)', timeVisible: true, secondsVisible: true },
    });

    candleSeries = chart.addCandlestickSeries({
      upColor: '#00ff64',
      downColor: '#ff4444',
      borderUpColor: '#00ff64',
      borderDownColor: '#ff4444',
      wickUpColor: '#00ff64',
      wickDownColor: '#ff4444',
    });

    volumeSeries = chart.addHistogramSeries({
      color: 'rgba(255,255,255,0.2)',
      priceFormat: { type: 'volume' },
      priceScaleId: 'volume',
    });

    window.addEventListener('resize', () => {
      const container = document.getElementById('chart-container');
      chart.resize(container.clientWidth, 400);
    });
  }

  // ============================================================
  // UPDATE FUNCTIONS
  // ============================================================

  function updateUI(data) {
    if (!data) return;

    document.getElementById('price').textContent = `$${data.price?.toFixed(8) || '0.000000'}`;
    document.getElementById('multiplier').textContent = `${data.multiplier?.toFixed(2) || '1.00'}x`;
    document.getElementById('target').textContent = `${data.profitTarget || 3.00}x`;
    document.getElementById('volume').textContent = `${data.volume?.toFixed(2) || '0.00'} SOL`;
    
    // Time left
    const seconds = data.timeRemaining || 0;
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    document.getElementById('timeLeft').textContent = 
      `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    
    document.getElementById('phase').textContent = data.phase?.toUpperCase() || 'IDLE';

    // Status badge
    const badge = document.getElementById('statusBadge');
    const phase = data.phase || 'idle';
    badge.className = `status-badge ${phase}`;
    badge.textContent = `● ${phase.toUpperCase()}`;

    // Token info
    if (data.tokenSymbol && data.tokenSymbol !== 'N/A') {
      document.getElementById('tokenSymbol').textContent = data.tokenSymbol;
    }
    if (data.tokenMint) {
      document.getElementById('tokenMint').textContent = data.tokenMint.slice(0, 8) + '...';
    }
  }

  function updateChart(price, volume) {
    const now = Math.floor(Date.now() / 1000);
    
    // Store price for candlestick generation
    priceHistory.push({ time: now, price: price, volume: volume || 0 });
    if (priceHistory.length > 500) priceHistory = priceHistory.slice(-500);

    // Generate candles (5 second intervals)
    const candles = [];
    const interval = 5;
    let currentCandle = null;

    for (const tick of priceHistory) {
      const candleTime = Math.floor(tick.time / interval) * interval;
      
      if (!currentCandle || currentCandle.time !== candleTime) {
        if (currentCandle) candles.push({ ...currentCandle });
        currentCandle = {
          time: candleTime,
          open: tick.price,
          high: tick.price,
          low: tick.price,
          close: tick.price,
          volume: tick.volume || 0,
        };
      } else {
        currentCandle.high = Math.max(currentCandle.high, tick.price);
        currentCandle.low = Math.min(currentCandle.low, tick.price);
        currentCandle.close = tick.price;
        currentCandle.volume += tick.volume || 0;
      }
    }
    if (currentCandle) candles.push({ ...currentCandle });

    if (candles.length > 0) {
      candleSeries.setData(candles.slice(-200));
      
      const volumeData = candles.slice(-200).map(c => ({
        time: c.time,
        value: c.volume || 0,
        color: c.close >= c.open ? 'rgba(0,255,100,0.3)' : 'rgba(255,68,68,0.3)',
      }));
      volumeSeries.setData(volumeData);
      chart.timeScale().fitContent();
    }
  }

  // ============================================================
  // API CALLS
  // ============================================================

  async function fetchStatus() {
    try {
      const res = await fetch('/api/current');
      const data = await res.json();
      if (data.success) {
        updateUI(data.data);
        if (data.data.price > 0) {
          updateChart(data.data.price, data.data.volume);
        }
      }
    } catch (e) {
      // Ignore
    }
  }

  async function triggerExit() {
    if (!confirm('🔥 Trigger exit now? All wallets will sell simultaneously.')) return;
    try {
      const res = await fetch('/api/exit', { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        log('🔥 Exit triggered!', 'warning');
      } else {
        log('❌ Exit failed: ' + data.error, 'error');
      }
    } catch (e) {
      log('❌ Error: ' + e.message, 'error');
    }
  }

  async function triggerStop() {
    if (!confirm('Stop the bundler?')) return;
    try {
      const res = await fetch('/api/stop', { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        log('⏹ Bundler stopped', 'success');
      } else {
        log('❌ Stop failed: ' + data.error, 'error');
      }
    } catch (e) {
      log('❌ Error: ' + e.message, 'error');
    }
  }

  function refresh() {
    fetchStatus();
    log('🔄 Refreshed', 'info');
  }

  // ============================================================
  // LOG
  // ============================================================

  function log(message, type = 'info') {
    const el = document.getElementById('log');
    const colors = { info: 'info', success: 'success', warning: 'warning', error: 'error' };
    el.innerHTML += `<div class="${colors[type] || 'info'}">${message}</div>`;
    el.scrollTop = el.scrollHeight;
    if (el.children.length > 50) {
      el.removeChild(el.firstChild);
    }
  }

  // ============================================================
  // START
  // ============================================================

  function start() {
    initChart();
    log('📊 Dashboard connected', 'success');
    fetchStatus();
    setInterval(fetchStatus, 2000);
  }

  // Initial fetch when page loads
  document.addEventListener('DOMContentLoaded', start);
</script>

</body>
</html>
