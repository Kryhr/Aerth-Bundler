<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AERTH BUNDLER - Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --green: #26a69a;
    --red: #ef5350;
    --amber: #d29922;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    transition: background 0.3s;
  }
  header.closed {
    background: #1c1712;
    border-bottom-color: var(--amber);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .badge {
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    margin-left: 10px;
  }
  .badge.closed {
    color: var(--amber);
    border-color: var(--amber);
    font-weight: 700;
  }
  #status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 6px;
  }
  #status-dot.live { background: var(--green); }
  #status-dot.closed { background: var(--amber); }

  .layout {
    display: flex;
    height: calc(100vh - 49px);
  }
  #chart-container {
    flex: 1;
    min-width: 0;
  }
  aside {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .stat .label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 4px;
  }
  aside .stat:first-child .value { font-size: 26px; }
  .stat .value.green { color: var(--green); }
  .stat .value.red { color: var(--red); }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    aside {
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      border-left: none;
      border-top: 1px solid var(--border);
    }
  }
</style>
</head>
<body>
  <header id="header">
    <h1><span id="status-dot"></span>AERTH BUNDLER <span class="badge" id="token-badge">no token</span></h1>
  </header>
  <div class="layout">
    <div id="chart-container"></div>
    <aside>
      <div class="stat">
        <div class="label">Market Cap</div>
        <div class="value" id="mcap-value">--</div>
      </div>
      <div class="stat">
        <div class="label">Price</div>
        <div class="value" id="price-value">--</div>
      </div>
      <div class="stat">
        <div class="label" id="multiplier-label">Multiplier</div>
        <div class="value" id="multiplier-value">1.00x</div>
      </div>
      <div class="stat">
        <div class="label" id="volume-label">Volume</div>
        <div class="value" id="volume-value">0.00 SOL</div>
      </div>
      <div class="stat">
        <div class="label">Phase</div>
        <div class="value" id="phase-value">idle</div>
      </div>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script>
    const socket = io();
    const header = document.getElementById('header');
    const statusDot = document.getElementById('status-dot');
    const tokenBadge = document.getElementById('token-badge');
    const priceEl = document.getElementById('price-value');
    const mcapEl = document.getElementById('mcap-value');
    const multiplierEl = document.getElementById('multiplier-value');
    const multiplierLabel = document.getElementById('multiplier-label');
    const volumeEl = document.getElementById('volume-value');
    const volumeLabel = document.getElementById('volume-label');
    const phaseEl = document.getElementById('phase-value');

    const CLOSED_PHASES = new Set(['complete', 'error']);

    function formatPrice(p) {
      if (!p || p <= 0) return '--';
      if (p >= 1) return p.toFixed(4);
      // Show ~4 significant digits regardless of how many leading zeros the
      // price has after the decimal point - toFixed(8) alone silently
      // rounds a price like 0.0000000045 down to "0.00000000".
      const leadingZeros = Math.max(0, -Math.floor(Math.log10(p)) - 1);
      return p.toFixed(Math.min(20, leadingZeros + 4));
    }

    function formatSolAmount(v) {
      if (!v || v <= 0) return '0.00 SOL';
      if (v >= 1_000_000) return (v / 1_000_000).toFixed(2) + 'M SOL';
      if (v >= 1_000) return (v / 1_000).toFixed(2) + 'K SOL';
      return v.toFixed(2) + ' SOL';
    }

    // Devnet has no real price feed - matches the server's SOL_USD_PRICE
    // default (see .env). Used only for realistic-looking market cap
    // display, like Axiom/pump.fun show it ($16.2K) - never for trading math.
    const SOL_USD_PRICE = 150;

    function formatUsd(v) {
      if (!v || v <= 0) return '$0.00';
      if (v >= 1_000_000) return '$' + (v / 1_000_000).toFixed(2) + 'M';
      if (v >= 1_000) return '$' + (v / 1_000).toFixed(1) + 'K';
      return '$' + v.toFixed(2);
    }

    socket.on('connect', () => statusDot.classList.add('live'));
    socket.on('disconnect', () => statusDot.classList.remove('live'));

    socket.on('status', (status) => {
      const closed = CLOSED_PHASES.has(status.phase);

      tokenBadge.textContent = status.tokenSymbol
        ? `${status.tokenSymbol}${status.tokenMint ? ' · ' + status.tokenMint.slice(0, 4) + '…' + status.tokenMint.slice(-4) : ''}`
        : 'no token';
      tokenBadge.classList.toggle('closed', closed);

      header.classList.toggle('closed', closed);
      statusDot.classList.toggle('live', !closed);
      statusDot.classList.toggle('closed', closed);

      priceEl.textContent = formatPrice(status.currentPrice);

      const marketCap = (status.currentPrice || 0) * (status.tokenSupply || 0) * SOL_USD_PRICE;
      mcapEl.textContent = formatUsd(marketCap);

      const multiplier = status.currentMultiplier || 1;
      multiplierLabel.textContent = closed ? 'Final Multiplier' : 'Multiplier';
      multiplierEl.textContent = multiplier.toFixed(2) + 'x';
      multiplierEl.className = 'value ' + (multiplier >= 1 ? 'green' : 'red');

      volumeLabel.textContent = closed ? 'Final Volume' : 'Volume';
      volumeEl.textContent = formatSolAmount(status.totalVolume || 0);

      phaseEl.textContent = closed ? `${status.phase} (closed)` : (status.phase || 'idle');
    });
  </script>
  <script src="chart.js"></script>
</body>
</html>
